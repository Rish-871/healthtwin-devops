name: CI — Test, Lint & Build

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Python backend tests
  # ─────────────────────────────────────────────
  backend-tests:
    name: 🐍 Backend Tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with verbose output
        run: python -m pytest tests/ -v --tb=short

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: .pytest_cache/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 2: Frontend lint + type-check
  # ─────────────────────────────────────────────
  frontend-checks:
    name: ⚛️ Frontend Checks (ESLint + TypeScript)
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type-check
        run: npm run typecheck

      - name: Build frontend (production)
        run: npm run build

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3: Docker compose build validation
  # ─────────────────────────────────────────────
  docker-build:
    name: 🐳 Docker Build Validation
    runs-on: ubuntu-latest
    needs: backend-tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (cache enabled)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: healthtwin-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Frontend image (cache enabled)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          push: false
          tags: healthtwin-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify API image structure
        run: |
          echo "=== Verifying API image is well-formed ==="
          docker inspect healthtwin-api:ci --format '{{.Config.ExposedPorts}}'
          docker inspect healthtwin-api:ci --format '{{.Config.Cmd}}'
          echo "API image structure check passed ✅"

      - name: Verify Frontend image structure
        run: |
          echo "=== Verifying Frontend image is well-formed ==="
          docker inspect healthtwin-frontend:ci --format '{{.Config.ExposedPorts}}'
          docker inspect healthtwin-frontend:ci --format '{{.Config.Cmd}}'
          echo "Frontend image structure check passed ✅"

      - name: Run API with Flask dev server (no TF model load wait)
        run: |
          # Run Flask directly (bypasses Gunicorn multi-worker TF load delay)
          docker run -d --name api-test -p 5000:5000 \
            -e MODEL_PATH=/nonexistent \
            -e PREPROCESSOR_PATH=/nonexistent \
            --entrypoint python \
            healthtwin-api:ci api.py
          echo "Waiting for Flask dev server (up to 30s)..."
          for i in $(seq 1 10); do
            if curl -sf http://localhost:5000/healthz; then
              echo "API is healthy! ✅"
              docker stop api-test
              exit 0
            fi
            echo "Attempt $i/10 — retrying in 3s..."
            sleep 3
          done
          echo "=== Container logs ==="
          docker logs api-test
          docker stop api-test
          exit 1
